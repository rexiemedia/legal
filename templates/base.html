<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ product }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    :root {
      --bg: {{ theme.bg }};
      --card: {{ theme.card }};
      --text: {{ theme.text }};
      --muted: {{ theme.muted }};
      --accent: {{ theme.accent }};
      --border: {{ theme.border }};
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="{{ url_for('privacy') }}" class="nav-brand">{{ company }}</a>
      <div class="nav-links">
        <a href="{{ url_for('privacy') }}" class="{% if request.endpoint == 'privacy' %}active{% endif %}">Privacy</a>
        <a href="{{ url_for('terms') }}" class="{% if request.endpoint == 'terms' %}active{% endif %}">Terms</a>
        <a href="{{ url_for('security') }}" class="{% if request.endpoint == 'security' %}active{% endif %}">Security</a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer-bar">
    <div class="footer-inner">
      <div>
        © {{ effective[:4] }} {{ company }}. All rights reserved.
      </div>
      <div class="footer-links">
        <a href="{{ url_for('privacy') }}">Privacy Policy</a>
        <a href="{{ url_for('terms') }}">Terms of Use</a>
        <a href="{{ url_for('security') }}">Security</a>
      </div>
      <div class="footer-meta">
        {{ product }} ({{ app }}) · v{{ version }}
      </div>
    </div>
  </footer>
</body>
</html>
